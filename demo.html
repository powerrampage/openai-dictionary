<!DOCTYPE html>
<html>
<head>
    <title>Simple Dictionary Test</title>
</head>
<body>
    <h2>Dictionary API Test</h2>
    
    <input id="wordInput" placeholder="Enter a word">
    <button onclick="lookup()">Look Up</button>
    
    <div id="result" style="margin-top:20px; font-family:monospace;"></div>

    <script>
        async function lookup() {
            const word = document.getElementById('wordInput').value || 'hello';
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = `Looking up "${word}"...`;
            
            try {
                const response = await fetch(`http://localhost:3000/dictionary/stream?word=${word}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                let fullText = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    fullText += chunk;
                    
                    // Update as we receive chunks
                    resultDiv.innerHTML = `
                        <h3>Streaming response for "${word}":</h3>
                        <pre>${fullText}</pre>
                    `;
                }
                
                try {
                    const json = JSON.parse(fullText);
                    resultDiv.innerHTML = `
                        <h3>Final result for "${word}":</h3>
                        <pre>${JSON.stringify(json, null, 2)}</pre>
                    `;
                } catch (e) {
                    // Keep raw text if not valid JSON
                }
                
            } catch (error) {
                resultDiv.innerHTML = `Error: ${error.message}`;
            }
        }
        
        window.onload = lookup;
    </script>
</body>
</html>
